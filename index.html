<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trinkbrunnen-Finder</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trinkbrunnen" />
<meta name="theme-color" content="#1b3a2f" />
<script data-goatcounter="https://trinkbrunnen-finder.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #controls {
    padding: 10px 12px;
    background: #1b3a2f;
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    z-index: 1000;
  }
  #controls h1 {
    font-size: 15px;
    margin: 0 8px 0 0;
    white-space: nowrap;
  }
  #controls label { font-size: 12px; display: flex; align-items: center; gap: 4px; }
  #controls .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,0.2); margin: 0 16px; }
  #controls input[type=number] { width: 55px; padding: 4px; border-radius: 4px; border: none; }
  #controls button, #controls .filebtn {
    background: #2e7d5b;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #controls button:disabled { background: #4a6157; cursor: not-allowed; }
  #controls input[type=file] { display: none; }
  #status {
    font-size: 12px;
    padding: 4px 12px;
    background: #0f2620;
    color: #cfe9dc;
    min-height: 16px;
  }
  #liveInfo {
    display: none;
    font-size: 18px;
    font-weight: 600;
    padding: 10px 12px;
    background: #123c66;
    color: #fff;
    text-align: center;
  }
  #liveInfo.visible { display: block; }
  #liveInfo .coords {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.75;
    margin-top: 2px;
  }
  #map { flex: 1; }
  .fountain-icon {
    background: #1e88e5;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 14px;
    height: 14px;
    box-shadow: 0 0 3px rgba(0,0,0,0.5);
  }
  #locateBtn.active { background: #1e88e5; }
  .leaflet-popup-content { font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <h1>💧 Trinkbrunnen-Finder</h1>
    <label class="filebtn">
      GPX laden
      <input type="file" id="gpxInput" accept=".gpx" />
    </label>
    <button id="clearBtn" disabled title="Route und Brunnen-Daten zurücksetzen">🗑️ Zurücksetzen</button>
    <button id="searchBtn" disabled title="Erst eine GPX-Datei laden">Brunnen im Track suchen</button>
    <label>Korridor (m)
      <input type="number" id="radius" value="400" min="50" max="2000" step="50">
    </label>
    <button id="exportBtn" disabled title="Erst Brunnen entlang der Route suchen">⬇️ GPX mit Brunnen</button>
    <span class="sep"></span>
    <label>Umkreis (km)
      <input type="number" id="nearbyRadius" value="10" min="1" max="50" step="1">
    </label>
    <button id="nearbyBtn">🚰 Umkreissuche</button>
    <button id="locateBtn">📍 Mein Standort</button>
  </div>
  <div id="status"></div>
  <div id="liveInfo"></div>
  <div id="map"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const liveInfoEl = document.getElementById('liveInfo');
  const searchBtn = document.getElementById('searchBtn');
  const exportBtn = document.getElementById('exportBtn');
  const clearBtn = document.getElementById('clearBtn');
  const gpxInput = document.getElementById('gpxInput');
  const radiusInput = document.getElementById('radius');
  const nearbyBtn = document.getElementById('nearbyBtn');
  const nearbyRadiusInput = document.getElementById('nearbyRadius');
  const locateBtn = document.getElementById('locateBtn');

  function setStatus(msg) { statusEl.textContent = msg; }

  const map = L.map('map').setView([50.7753, 6.0839], 13); // Aachen als Default
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
  }).addTo(map);

  let trackPoints = [];      // [{lat, lon}]
  let sampledPoints = [];    // downsampled for distance checks
  let routeLayer = null;
  let fountainLayer = L.layerGroup().addTo(map);
  let foundFountains = []; // [{lat, lon, name, id}] aus der letzten Suche
  let searchRadiusCircle = null; // zeigt den durchsuchten Umkreis bei der Nähe-Suche
  let searchPerformed = false; // unterscheidet "noch nicht gesucht" von "gesucht, 0 Treffer"
  let userMarker = null;
  let watchId = null;

  // --- Geometrie-Helfer ---
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // Downsample: nur Punkte behalten, die mind. minDist Meter vom letzten behaltenen entfernt sind
  function downsample(points, minDist) {
    if (points.length === 0) return [];
    const out = [points[0]];
    let last = points[0];
    for (const p of points) {
      if (haversine(last.lat, last.lon, p.lat, p.lon) >= minDist) {
        out.push(p);
        last = p;
      }
    }
    out.push(points[points.length - 1]);
    return out;
  }

  function minDistToRoute(lat, lon, samples) {
    let min = Infinity;
    for (const p of samples) {
      const d = haversine(lat, lon, p.lat, p.lon);
      if (d < min) min = d;
    }
    return min;
  }

  function parseGPX(text) {
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    const err = xml.querySelector('parsererror');
    if (err) throw new Error('GPX konnte nicht gelesen werden.');
    const trkpts = xml.querySelectorAll('trkpt, rtept');
    const pts = [];
    trkpts.forEach(el => {
      const lat = parseFloat(el.getAttribute('lat'));
      const lon = parseFloat(el.getAttribute('lon'));
      if (isNaN(lat) || isNaN(lon)) return;
      const p = { lat, lon };
      const eleEl = el.querySelector('ele');
      if (eleEl && eleEl.textContent.trim() !== '') p.ele = eleEl.textContent.trim();
      const timeEl = el.querySelector('time');
      if (timeEl && timeEl.textContent.trim() !== '') p.time = timeEl.textContent.trim();
      pts.push(p);
    });
    return pts;
  }

  // --- Persistenz (localStorage), damit Track + Brunnen einen Reload ohne Netz überstehen ---
  const STORAGE_KEY = 'trinkbrunnen_state_v1';

  let fountainsFromRoute = false; // true nur nach Korridor-Suche entlang einer Route (relevant für den GPX-Export)

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        trackPoints, fountains: foundFountains, fountainsFromRoute,
        radius: parseFloat(radiusInput.value) || 400,
        fileName: currentFileName, savedAt: new Date().toISOString()
      }));
    } catch (err) {
      console.warn('Konnte Zustand nicht speichern:', err);
    }
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    try {
      const state = JSON.parse(raw);
      const hasTrack = state.trackPoints && state.trackPoints.length > 0;
      const hasFountains = state.fountains && state.fountains.length > 0;
      if (!hasTrack && !hasFountains) return false;

      if (hasTrack) {
        trackPoints = state.trackPoints;
        sampledPoints = downsample(trackPoints, 40);
        currentFileName = state.fileName || null;
        drawRoute();
        searchBtn.disabled = false;
      }
      if (state.radius) radiusInput.value = state.radius;
      if (hasFountains) {
        foundFountains = state.fountains;
        renderFountainMarkers(foundFountains);
        fountainsFromRoute = !!state.fountainsFromRoute;
        searchPerformed = true;
        exportBtn.disabled = !(hasTrack && fountainsFromRoute);
        if (!hasTrack) map.fitBounds(L.latLngBounds(foundFountains.map(f => [f.lat, f.lon])), { padding: [30, 30] });
      }
      clearBtn.disabled = false;
      const savedDate = state.savedAt ? new Date(state.savedAt).toLocaleString('de-DE') : '';
      const label = hasTrack ? (currentFileName || 'ohne Namen') : 'Umkreis-Suche';
      setStatus(`Gespeicherter Zustand wiederhergestellt (${label}, gespeichert ${savedDate}). Funktioniert offline.`);
      return true;
    } catch (err) {
      console.warn('Konnte gespeicherten Zustand nicht laden:', err);
      return false;
    }
  }

  function clearRoute() {
    if (!confirm('Route und gespeicherte Brunnen-Daten wirklich löschen?')) return;
    trackPoints = [];
    sampledPoints = [];
    foundFountains = [];
    fountainsFromRoute = false;
    searchPerformed = false;
    currentFileName = null;
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    if (searchRadiusCircle) { map.removeLayer(searchRadiusCircle); searchRadiusCircle = null; }
    fountainLayer.clearLayers();
    gpxInput.value = '';
    searchBtn.disabled = true;
    exportBtn.disabled = true;
    clearBtn.disabled = true;
    liveInfoEl.classList.remove('visible');
    localStorage.removeItem(STORAGE_KEY);
    setStatus('Route und Brunnen-Daten gelöscht. Lade eine GPX-Datei oder nutze "Umkreissuche".');
  }

  clearBtn.addEventListener('click', clearRoute);

  function drawRoute() {
    if (routeLayer) map.removeLayer(routeLayer);
    const latlngs = trackPoints.map(p => [p.lat, p.lon]);
    routeLayer = L.polyline(latlngs, { color: '#e53935', weight: 4 }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
  }

  function renderFountainMarkers(list, autoOpenPopups) {
    fountainLayer.clearLayers();
    list.forEach(f => {
      const marker = L.circleMarker([f.lat, f.lon], {
        radius: 10, color: '#fff', weight: 3, fillColor: '#1e88e5', fillOpacity: 1
      }).addTo(fountainLayer);
      marker.bindPopup(
        `<b>${f.name}</b><br>` +
        `<a href="https://www.openstreetmap.org/node/${f.id}" target="_blank" rel="noopener">auf OSM ansehen</a>`
      );
      // Bei wenigen Treffern (z.B. 1 von 9 im Korridor) sonst auf einer langen Route kaum zu sehen.
      if (autoOpenPopups && list.length <= 3) marker.openPopup();
    });
  }

  let currentFileName = null;

  gpxInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      trackPoints = parseGPX(text);
      if (trackPoints.length === 0) {
        setStatus('Keine Track-Punkte in der GPX-Datei gefunden.');
        return;
      }
      sampledPoints = downsample(trackPoints, 40); // alle ~40m ein Referenzpunkt
      currentFileName = file.name;
      foundFountains = [];
      fountainsFromRoute = false;
      searchPerformed = false;
      fountainLayer.clearLayers();
      exportBtn.disabled = true;
      drawRoute();

      searchBtn.disabled = false;
      clearBtn.disabled = false;
      setStatus(`Track geladen: ${trackPoints.length} Punkte, ${sampledPoints.length} Stützpunkte für Korridor-Suche. Jetzt auf "Brunnen im Track suchen" tippen.`);
      saveState();
    } catch (err) {
      setStatus('Fehler beim Einlesen: ' + err.message);
    }
  });

  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  async function fetchOverpass(query) {
    let lastErr;
    for (let i = 0; i < OVERPASS_ENDPOINTS.length; i++) {
      const endpoint = OVERPASS_ENDPOINTS[i];
      for (let attempt = 1; attempt <= 2; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000); // Server, das nicht antwortet, soll nicht ewig hängen
        try {
          const host = new URL(endpoint).hostname;
          setStatus(`Suche Trinkbrunnen über ${host}… (Versuch ${attempt}${i > 0 ? ', Ausweich-Server' : ''})`);
          const resp = await fetch(endpoint, { method: 'POST', body: query, signal: controller.signal });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          return await resp.json();
        } catch (err) {
          lastErr = err.name === 'AbortError' ? new Error('Zeitüberschreitung (20s)') : err;
          if (attempt === 1) await new Promise(r => setTimeout(r, 1500));
        } finally {
          clearTimeout(timeoutId);
        }
      }
    }
    throw new Error('Alle Overpass-Server nicht erreichbar (' + lastErr.message + ')');
  }

  async function searchFountains() {
    if (sampledPoints.length === 0) return;
    const radius = parseFloat(radiusInput.value) || 400;
    searchBtn.disabled = true;
    setStatus('Suche Trinkbrunnen über Overpass API…');
    fountainLayer.clearLayers();
    foundFountains = [];

    const lats = trackPoints.map(p => p.lat);
    const lons = trackPoints.map(p => p.lon);
    const pad = (radius + 200) / 111000; // grobe Umrechnung Meter -> Grad
    const south = Math.min(...lats) - pad;
    const north = Math.max(...lats) + pad;
    const west = Math.min(...lons) - pad;
    const east = Math.max(...lons) + pad;

    const query = `[out:json][timeout:25];
      node["amenity"="drinking_water"](${south},${west},${north},${east});
      out body;`;

    try {
      const data = await fetchOverpass(query);
      const nodes = data.elements || [];

      nodes.forEach(n => {
        const d = minDistToRoute(n.lat, n.lon, sampledPoints);
        if (d <= radius) {
          const name = (n.tags && (n.tags.name || n.tags.description)) || 'Trinkbrunnen';
          foundFountains.push({ lat: n.lat, lon: n.lon, name, id: n.id });
        }
      });
      renderFountainMarkers(foundFountains, true);

      setStatus(`${nodes.length} Brunnen in der Bounding Box, ${foundFountains.length} davon im ${radius}m-Korridor um die Route. Für die Fahrt gespeichert — funktioniert jetzt auch offline.`);
      fountainsFromRoute = true;
      searchPerformed = true;
      exportBtn.disabled = foundFountains.length === 0;
      saveState();
    } catch (err) {
      setStatus('Fehler bei der Suche: ' + err.message + (foundFountains.length ? ' (alte Brunnen-Daten bleiben erhalten)' : ''));
    } finally {
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener('click', searchFountains);

  function describeGeoError(err) {
    if (err.code === 1) { // PERMISSION_DENIED
      return 'Standortzugriff verweigert. iPhone: Einstellungen > Safari > Standort (oder "aA" in der Adressleiste > Website-Einstellungen). Android Chrome: Symbol/Schloss in der Adressleiste > Berechtigungen > Standort. Danach Seite neu laden.';
    }
    if (err.code === 2) { // POSITION_UNAVAILABLE
      return 'Standort gerade nicht ermittelbar (z.B. kein GPS-Signal). Nochmal versuchen.';
    }
    if (err.code === 3) { // TIMEOUT
      return 'Standortabfrage hat zu lange gedauert. Nochmal versuchen.';
    }
    return err.message;
  }

  // --- Umkreis-Suche um den aktuellen Standort, ganz ohne geladene Route ---
  function getCurrentLatLon() {
    if (userMarker) {
      const ll = userMarker.getLatLng();
      return Promise.resolve({ lat: ll.lat, lon: ll.lng });
    }
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('Geolocation wird nicht unterstützt.')); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        (err) => reject(new Error(describeGeoError(err))),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
  }

  async function searchNearby() {
    nearbyBtn.disabled = true;
    setStatus('Ermittle Standort…');
    try {
      const { lat, lon } = await getCurrentLatLon();
      if (!userMarker) {
        userMarker = L.circleMarker([lat, lon], {
          radius: 8, color: '#fff', weight: 2, fillColor: '#e53935', fillOpacity: 1
        }).addTo(map);
      }

      const radiusKm = parseFloat(nearbyRadiusInput.value) || 10;
      const radiusM = Math.round(radiusKm * 1000);
      const query = `[out:json][timeout:25];
        node["amenity"="drinking_water"](around:${radiusM},${lat},${lon});
        out body;`;

      const data = await fetchOverpass(query);
      const nodes = data.elements || [];
      foundFountains = nodes.map(n => ({
        lat: n.lat, lon: n.lon, id: n.id,
        name: (n.tags && (n.tags.name || n.tags.description)) || 'Trinkbrunnen'
      }));
      fountainsFromRoute = false;
      searchPerformed = true;
      exportBtn.disabled = true; // diese Brunnen gehören zu keiner geladenen Route
      clearBtn.disabled = false;
      renderFountainMarkers(foundFountains);

      if (searchRadiusCircle) map.removeLayer(searchRadiusCircle);
      searchRadiusCircle = L.circle([lat, lon], {
        radius: radiusM, color: '#1e88e5', weight: 2, dashArray: '6 6', fill: false
      }).addTo(map);

      if (foundFountains.length > 0) {
        map.fitBounds(L.latLngBounds(foundFountains.map(f => [f.lat, f.lon]).concat([[lat, lon]])), { padding: [30, 30] });
      } else {
        map.fitBounds(searchRadiusCircle.getBounds(), { padding: [30, 30] });
      }

      if (foundFountains.length === 0) {
        setStatus(`Kein Trinkbrunnen im ${radiusKm} km Umkreis gefunden (OSM-Daten können lückenhaft sein — der blaue Kreis zeigt den durchsuchten Bereich). Größeren Umkreis probieren?`);
      } else {
        setStatus(`${foundFountains.length} Brunnen im ${radiusKm} km Umkreis um deinen Standort gefunden.`);
      }
      liveInfoEl.classList.add('visible');
      updateLiveInfo(lat, lon);
      saveState();
    } catch (err) {
      setStatus('Fehler bei der Umkreis-Suche: ' + err.message);
    } finally {
      nearbyBtn.disabled = false;
    }
  }

  nearbyBtn.addEventListener('click', searchNearby);

  // --- GPX-Export mit Brunnen als Wegpunkte (z.B. für Wahoo/Garmin-Kurs-POIs) ---
  function escapeXML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
    })[c]);
  }

  function nearestTrackPointIndex(lat, lon) {
    let bestIdx = 0;
    let bestDist = Infinity;
    for (let i = 0; i < trackPoints.length; i++) {
      const d = haversine(lat, lon, trackPoints[i].lat, trackPoints[i].lon);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    return { idx: bestIdx, dist: bestDist };
  }

  function trackCumulativeDistances() {
    const cum = [0];
    for (let i = 1; i < trackPoints.length; i++) {
      cum.push(cum[i - 1] + haversine(trackPoints[i - 1].lat, trackPoints[i - 1].lon, trackPoints[i].lat, trackPoints[i].lon));
    }
    return cum;
  }

  function trkptXML(p, indent) {
    const extra = [];
    if (p.ele !== undefined) extra.push(`${indent}  <ele>${p.ele}</ele>`);
    if (p.time !== undefined) extra.push(`${indent}  <time>${p.time}</time>`);
    if (extra.length === 0) return `${indent}<trkpt lat="${p.lat}" lon="${p.lon}"></trkpt>`;
    return `${indent}<trkpt lat="${p.lat}" lon="${p.lon}">\n${extra.join('\n')}\n${indent}</trkpt>`;
  }

  function buildGPX() {
    const trkpts = trackPoints.map(p => trkptXML(p, '      ')).join('\n');

    // Wahoo-Geräte zeigen Wegpunkte laut Support-Doku nur an, wenn sie exakt
    // auf dem Track liegen -> auf den nächsten Trackpunkt snappen. Zusätzlich
    // pro Brunnen die Streckendistanz (nicht Luftlinie) zum nächsten Brunnen
    // in Fahrtrichtung ausrechnen ("nächstes Wasser in Xkm", Tankstellen-Prinzip).
    const cum = trackCumulativeDistances();
    const enriched = foundFountains
      .map(f => {
        const { idx, dist } = nearestTrackPointIndex(f.lat, f.lon);
        return { f, idx, dist, point: trackPoints[idx] };
      })
      .sort((a, b) => a.idx - b.idx);

    const wpts = enriched.map((e, i) => {
      const offsetLabel = e.dist >= 15 ? ` (ca. ${formatDist(e.dist)} abseits der Route)` : '';
      let nextLabel = '';
      if (i < enriched.length - 1) {
        const distToNext = Math.abs(cum[enriched[i + 1].idx] - cum[e.idx]);
        nextLabel = ` – nächstes Wasser in ${formatDist(distToNext)}`;
      } else {
        const distToEnd = Math.abs(cum[cum.length - 1] - cum[e.idx]);
        if (distToEnd >= 15) nextLabel = ` – noch ${formatDist(distToEnd)} bis ins Ziel`;
      }
      const name = `${escapeXML(e.f.name)}${offsetLabel}${nextLabel}`;
      const eleLine = e.point.ele !== undefined ? `\n    <ele>${e.point.ele}</ele>` : '';
      return `  <wpt lat="${e.point.lat}" lon="${e.point.lon}">
    <name>${name}</name>
    <desc></desc>${eleLine}
    <sym>Water Source</sym>
    <type>Water Source</type>
  </wpt>`;
    }).join('\n');

    // Format an ein GPX angelehnt, das nachweislich funktioniert (Strava-Export
    // mit custom Waypoint, über Strava<->Wahoo-Sync korrekt auf dem Ace gezeigt):
    // xsi:schemaLocation gesetzt, <type> identisch zu <sym> ("Water Source"),
    // <ele>/<time> je Trackpunkt uebernommen (falls in der Quelldatei vorhanden).
    return `<?xml version="1.0" encoding="UTF-8"?>
<gpx creator="Trinkbrunnen-Finder" version="1.1" xmlns="http://www.topografix.com/GPX/1/1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
 <metadata>
  <name>${escapeXML(currentFileName || 'Route')}</name>
  <copyright author="OpenStreetMap contributors">
   <year>${new Date().getFullYear()}</year>
   <license>https://www.openstreetmap.org/copyright</license>
  </copyright>
 </metadata>
${wpts}
  <trk>
    <name>${escapeXML(currentFileName || 'Route')} (mit Trinkbrunnen)</name>
    <type>cycling</type>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>
`;
  }

  function exportGPX() {
    if (trackPoints.length === 0 || foundFountains.length === 0) return;
    const gpxText = buildGPX();
    const blob = new Blob([gpxText], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const base = (currentFileName || 'route').replace(/\.gpx$/i, '');
    const a = document.createElement('a');
    a.href = url;
    a.download = `${base}_mit_brunnen.gpx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus(`GPX mit ${foundFountains.length} Brunnen-Wegpunkten exportiert: ${a.download}`);
  }

  exportBtn.addEventListener('click', exportGPX);

  // --- Live-Standort ---
  function nearestFountain(lat, lon) {
    let best = null;
    let bestDist = Infinity;
    for (const f of foundFountains) {
      const d = haversine(lat, lon, f.lat, f.lon);
      if (d < bestDist) { bestDist = d; best = f; }
    }
    return best ? { fountain: best, dist: bestDist } : null;
  }

  function formatDist(m) {
    return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
  }

  function updateLiveInfo(lat, lon) {
    const coordsLine = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    if (!searchPerformed) {
      liveInfoEl.innerHTML = `Noch keine Brunnen-Suche gemacht — "Brunnen im Track suchen" oder "Umkreissuche" nutzen.<div class="coords">${coordsLine}</div>`;
      return;
    }
    if (foundFountains.length === 0) {
      liveInfoEl.innerHTML = `Kein Brunnen im zuletzt durchsuchten Bereich bekannt.<div class="coords">${coordsLine}</div>`;
      return;
    }
    const nearest = nearestFountain(lat, lon);
    liveInfoEl.innerHTML = `🚰 Nächster Brunnen: ${formatDist(nearest.dist)} — ${nearest.fountain.name}<div class="coords">${coordsLine}</div>`;
  }

  locateBtn.addEventListener('click', () => {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      locateBtn.classList.remove('active');
      if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
      liveInfoEl.classList.remove('visible');
      setStatus('Standort-Tracking gestoppt.');
      return;
    }
    if (!navigator.geolocation) {
      setStatus('Geolocation wird von diesem Browser nicht unterstützt.');
      return;
    }
    locateBtn.classList.add('active');
    liveInfoEl.classList.add('visible');
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        if (!userMarker) {
          userMarker = L.circleMarker([latitude, longitude], {
            radius: 8, color: '#fff', weight: 2, fillColor: '#e53935', fillOpacity: 1
          }).addTo(map);
          map.panTo([latitude, longitude]);
        } else {
          userMarker.setLatLng([latitude, longitude]);
        }
        updateLiveInfo(latitude, longitude);
      },
      (err) => setStatus('Standortfehler: ' + describeGeoError(err)),
      { enableHighAccuracy: true, maximumAge: 5000 }
    );
  });

  // --- Start ---
  if (!loadState()) {
    setStatus('Willkommen! Entweder oben "GPX laden" für eine Tour, oder direkt "🚰 Umkreissuche" ohne geladene Route.');
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service Worker konnte nicht registriert werden:', err);
    });
  }
</script>
</body>
</html>
